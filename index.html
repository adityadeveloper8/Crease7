<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crease – Free Cricket Predictions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef2e4;--card:#fbfcf6;--ink:#152238;--mute:#5d6b5a;--red:#b3261e;--ok:#2e7d4f;--line:#d3dcc2;--tan:#e6cf9f;--yes:#dcefdc;--yest:#1f6b3a;--no:#f6dcd8;--not:#a02a20;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111a14;--card:#1a261e;--ink:#eaf0e2;--mute:#9aac97;--red:#ef6a5f;--ok:#63c58a;--line:#2b3b30;--tan:#5b4d2c;--yes:#1f3a29;--yest:#7fd9a0;--no:#3d2622;--not:#f08a80}}
:root[data-theme="dark"]{--bg:#111a14;--card:#1a261e;--ink:#eaf0e2;--mute:#9aac97;--red:#ef6a5f;--ok:#63c58a;--line:#2b3b30;--tan:#5b4d2c;--yes:#1f3a29;--yest:#7fd9a0;--no:#3d2622;--not:#f08a80}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.4}
main{max-width:520px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:1.9rem;font-weight:800;margin:0;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pill{border:1.5px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:800}
.sub{color:var(--mute);font-size:.85rem}
.chips{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.chips button{padding:6px 14px;border:1.5px solid var(--line);background:none;color:var(--ink);font:600 .9rem inherit;font-family:inherit;border-radius:999px}
.chips button.on{border-color:var(--ink);background:var(--tan)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:.85rem;margin-bottom:8px}
.q{font-size:1.1rem;font-weight:700;margin:0 0 12px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{padding:14px 8px;border:none;border-radius:10px;font:800 1.05rem inherit;font-family:inherit}
.yn small{display:block;font-weight:400;font-size:.78rem;opacity:.85}
.y{background:var(--yes);color:var(--yest)}.n{background:var(--no);color:var(--not)}
.yn button:disabled{opacity:.45}
.yn button.chosen{outline:3px solid var(--ink);opacity:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.foot{margin-top:10px;font-size:.9rem;display:flex;justify-content:space-between;gap:8px;align-items:center}
.live{color:var(--red);font-weight:800}
.good{color:var(--ok);font-weight:700}.bad{color:var(--red);font-weight:700}
.go{border:none;background:var(--red);color:#fff;font:600 .9rem inherit;font-family:inherit;padding:8px 14px;border-radius:999px}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border:none}.rk{width:1.6rem;font-weight:800;color:var(--mute)}.nm{flex:1;font-weight:600}.sc{font-weight:800}
.row.me{background:var(--tan);border-radius:10px;padding-left:10px;padding-right:10px}
.join{margin-top:18vh;text-align:center}.join p{color:var(--mute)}
input{width:100%;padding:12px;font:1rem inherit;font-family:inherit;border:1.5px solid var(--ink);border-radius:10px;background:var(--card);color:var(--ink);margin:12px 0}
.hide{display:none}
.code{font-size:1.6rem;font-weight:800;letter-spacing:.12em;text-align:center;padding:8px;border:1.5px solid var(--ink);border-radius:10px;margin:8px 0}
.prize{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;margin-bottom:12px}
.prize h2{margin:0 0 6px;font-size:1.2rem}.prize p{margin:4px 0;opacity:.85;font-size:.9rem}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 2px;border:none;background:none;color:var(--mute);font:600 .8rem inherit;font-family:inherit}
nav button.on{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--red)}
</style>
</head>
<body>
<main>
  <section id="join" class="join">
    <h1>Crease</h1>
    <p>Say Yes or No on cricket matches. Use free points. Climb the ranking.</p>
    <input id="name" placeholder="Your name" maxlength="16" aria-label="Your name">
    <button class="go" id="start" style="width:100%;padding:12px">Start with 1000 free points</button>
  </section>

  <section id="app" class="hide">
    <div class="top"><h1>Crease</h1><div class="pill" id="bal">1000 pts</div></div>
    <div id="explore">
      <div class="chips" id="flt">
        <button class="on" data-f="all">All</button>
        <button data-f="india">India</button>
        <button data-f="world">World</button>
      </div>
      <div class="chips" id="stk"><span class="sub" style="align-self:center">Points per pick:</span>
        <button data-s="10">10</button><button class="on" data-s="50">50</button><button data-s="100">100</button>
      </div>
      <div id="matches"></div>
    </div>
    <div id="ranking" class="card hide"></div>
    <div id="referral" class="hide">
      <div class="prize"><h2>Invite friends</h2><p>Share your code so friends can join and compete with you.</p><p>Free to play. No deposits, no stakes.</p></div>
      <div class="card"><b>Your code</b><div class="code" id="code"></div>
        <button class="go" id="share" style="width:100%;padding:12px">Share Crease</button></div>
    </div>
    <div id="portfolio" class="hide"></div>
    <div id="me" class="hide"></div>
  </section>
</main>
<nav id="nav" class="hide">
  <button class="on" data-v="explore">Explore</button>
  <button data-v="ranking">Ranking</button>
  <button data-v="referral">Referral</button>
  <button data-v="portfolio">Portfolio</button>
  <button data-v="me">Me</button>
</nav>

<script>
var START=1000;
var matches=[
 {id:"1",a:"India",b:"Australia",fmt:"T20",live:"LIVE",when:"IND 142/3 (16.2 ov)",winner:null,region:"india"},
 {id:"2",a:"England",b:"South Africa",fmt:"ODI",when:"Tomorrow 2:30 PM",winner:null,region:"world"},
 {id:"3",a:"Pakistan",b:"New Zealand",fmt:"T20",when:"Sat 6:30 PM",winner:null,region:"world"},
 {id:"4",a:"Sri Lanka",b:"West Indies",fmt:"ODI",when:"Sun 10:00 AM",winner:null,region:"world"}
];
var demo=true,filt="all",stake=50,me="",bets={},code="";
var others=[{n:"Arjun",s:1450},{n:"Maya",s:1320},{n:"Tom",s:1180},{n:"Sana",s:1050},{n:"Lewis",s:940}];
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function balance(){
  var t=START;
  Object.keys(bets).forEach(function(k){
    var b=bets[k];t-=b.stake;
    if(b.res==="won")t+=b.stake*2;else if(b.res==="void")t+=b.stake;
  });
  return t;
}
function settle(){
  matches.forEach(function(m){
    var b=bets[m.id];if(!b||b.res)return;
    if(m.winner){b.res=((b.side==="yes")===(m.winner==="a"))?"won":"lost"}
    else if(m.ended){b.res="void"}
  });
}
function save(){
  var keep={};Object.keys(bets).forEach(function(k){if(!bets[k].demo)keep[k]=bets[k]});
  try{localStorage.setItem("crease2",JSON.stringify({me:me,bets:keep,code:code}))}catch(e){}
}

function renderExplore(){
  var shown=matches.filter(function(m){return filt==="all"||m.region===filt});
  if(!shown.length){$("matches").innerHTML='<div class="card sub">No matches here right now. Check back soon.</div>';return}
  var bal=balance();
  $("matches").innerHTML=shown.map(function(m){
    var b=bets[m.id],locked=!!m.winner||!!m.started||m.ended;
    var q=esc(m.a)+" to win the match against "+esc(m.b)+"?";
    var off=b||locked||bal<stake;
    var foot;
    if(b){
      var r=b.res==="won"?'<span class="good">Won +'+b.stake*2+' pts</span>':b.res==="lost"?'<span class="bad">Lost '+b.stake+' pts</span>':b.res==="void"?'<span class="sub">Refunded</span>':'<span class="sub">Result pending</span>';
      foot='<span class="sub">You said '+(b.side==="yes"?"Yes":"No")+' with '+b.stake+' pts</span>'+r;
    }else if(locked){foot='<span class="sub">Picks closed</span>'}
    else{foot='<span class="sub">'+(bal<stake?"Not enough points":"Pick "+stake+" pts")+'</span>'+(demo?'<button class="go" data-play="'+m.id+'">Play result</button>':'')}
    return '<div class="card"><div class="meta"><span>'+esc(m.fmt)+(m.live&&!m.winner?' <span class="live">\u25cf '+m.live+'</span>':'')+'</span><span>'+esc(m.when)+'</span></div>'+
      '<p class="q">'+q+'</p><div class="yn">'+
      '<button class="y'+(b&&b.side==="yes"?" chosen":"")+'" data-m="'+m.id+'" data-side="yes"'+(off?" disabled":"")+'>Yes<small>win 2\u00d7</small></button>'+
      '<button class="n'+(b&&b.side==="no"?" chosen":"")+'" data-m="'+m.id+'" data-side="no"'+(off?" disabled":"")+'>No<small>win 2\u00d7</small></button></div>'+
      '<div class="foot">'+foot+'</div></div>';
  }).join("");
}
function renderRanking(){
  var rows=others.concat([{n:me,s:balance(),me:true}]).sort(function(x,y){return y.s-x.s});
  $("ranking").innerHTML=rows.map(function(r,i){
    return '<div class="row'+(r.me?" me":"")+'"><span class="rk">'+(i+1)+'</span><span class="nm">'+esc(r.n)+(r.me?" (you)":"")+'</span><span class="sc">'+r.s+'</span></div>';
  }).join("");
}
function renderPortfolio(){
  var ks=Object.keys(bets).filter(function(k){return !bets[k].demo||demo});
  if(!ks.length){$("portfolio").innerHTML='<div class="card sub">No picks yet. Go to Explore and say Yes or No on a match.</div>';return}
  $("portfolio").innerHTML=ks.reverse().map(function(k){
    var b=bets[k];
    var st=b.res==="won"?'<span class="good">Won +'+b.stake*2+'</span>':b.res==="lost"?'<span class="bad">Lost '+b.stake+'</span>':b.res==="void"?'<span class="sub">Refunded</span>':'<span class="sub">Open</span>';
    return '<div class="card"><p class="q" style="margin-bottom:6px">'+esc(b.q)+'</p><div class="foot"><span class="sub">'+(b.side==="yes"?"Yes":"No")+' \u00b7 '+b.stake+' pts</span>'+st+'</div></div>';
  }).join("");
}
function renderMe(){
  var w=0,l=0;Object.keys(bets).forEach(function(k){if(bets[k].res==="won")w++;if(bets[k].res==="lost")l++});
  $("me").innerHTML='<div class="card"><b>'+esc(me)+'</b><div class="sub">Points: '+balance()+' \u00b7 Won: '+w+' \u00b7 Lost: '+l+'</div></div>'+
   '<div class="prize"><h2>Weekly sponsor prizes</h2><p>Top 3 on the Sunday ranking win gift cards from sponsors.</p><p>Points cannot be bought or cashed out.</p></div>'+
   '<button class="go" id="reset" style="width:100%;padding:12px">Reset my points</button>';
  $("reset").onclick=function(){if(confirm("Reset points and all picks?")){bets={};save();render()}};
}
function render(){
  settle();save();
  $("bal").textContent=balance()+" pts";
  renderExplore();renderRanking();renderPortfolio();renderMe();
}
function show(v){
  ["explore","ranking","referral","portfolio","me"].forEach(function(id){$(id).classList.toggle("hide",id!==v)});
  Array.prototype.forEach.call($("nav").children,function(b){b.classList.toggle("on",b.dataset.v===v)});
}

$("start").onclick=function(){
  var v=$("name").value.trim();
  if(!v){$("name").focus();return}
  me=v;
  if(!code)code=v.slice(0,3).toUpperCase().replace(/[^A-Z]/g,"X")+Math.floor(100+Math.random()*900);
  $("code").textContent=code;
  $("join").classList.add("hide");$("app").classList.remove("hide");$("nav").classList.remove("hide");
  render();load();
};
$("nav").onclick=function(e){var t=e.target.closest("button");if(t)show(t.dataset.v)};
$("flt").onclick=function(e){
  var t=e.target.closest("button");if(!t)return;filt=t.dataset.f;
  Array.prototype.forEach.call($("flt").children,function(b){b.classList.toggle("on",b===t)});renderExplore();
};
$("stk").onclick=function(e){
  var t=e.target.closest("button");if(!t)return;stake=+t.dataset.s;
  Array.prototype.forEach.call($("stk").querySelectorAll("button"),function(b){b.classList.toggle("on",b===t)});renderExplore();
};
$("matches").onclick=function(e){
  var t=e.target.closest("button");if(!t)return;
  var m=matches.filter(function(x){return x.id===t.dataset.m||x.id===t.dataset.play})[0];
  if(!m)return;
  if(t.dataset.side){
    if(bets[m.id]||balance()<stake)return;
    bets[m.id]={q:m.a+" to win the match against "+m.b+"?",side:t.dataset.side,stake:stake,res:null,demo:demo};
    render();
  }
  if(t.dataset.play){m.winner=Math.random()<0.5?"a":"b";render()}
};
$("share").onclick=function(){
  var txt="Join me on Crease, the free cricket prediction game. My code: "+code+" \u2013 "+location.origin;
  try{if(navigator.share){navigator.share({text:txt});return}}catch(e){}
  try{navigator.clipboard.writeText(txt);$("share").textContent="Copied"}catch(e){}
};

try{var d=JSON.parse(localStorage.getItem("crease2")||"null");if(d&&d.me){$("name").value=d.me;bets=d.bets||{};code=d.code||""}}catch(e){}

function load(){
  fetch("/api/matches").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
    var list=(j.data||[]).filter(function(x){return x.teams&&x.teams.length===2}).slice(0,45).map(function(x){
      var w=null,st=x.status||"";
      if(x.matchEnded){if(st.indexOf(x.teams[0]+" won")===0)w="a";else if(st.indexOf(x.teams[1]+" won")===0)w="b"}
      var sc=(x.score||[]).map(function(q){return q.r+"/"+q.w+" ("+q.o+")"}).join(" | ");
      return {id:x.id,a:x.teams[0],b:x.teams[1],fmt:(x.matchType||"").toUpperCase(),live:(x.matchStarted&&!x.matchEnded)?"LIVE":null,started:!!x.matchStarted,ended:!!x.matchEnded,when:sc||st,winner:w,region:x.region||"world"};
    });
    if(list.length){matches=list;demo=false}
    render();
  }).catch(function(){render()});
}
</script>
</body>
</html>
